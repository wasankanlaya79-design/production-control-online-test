<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Executive Production Dashboard</title><style>body{font-family:Arial;margin:0;background:#f1f5f9;color:#0f172a}.wrap{max-width:1200px;margin:auto;padding:22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;padding:18px;border-radius:16px;box-shadow:0 2px 10px #0001}.n{font-size:34px;font-weight:900}table{width:100%;border-collapse:collapse;background:white;margin-top:16px}th,td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:right}th:first-child,td:first-child{text-align:left}.bar{height:10px;background:#e2e8f0;border-radius:10px;overflow:hidden}.fill{height:100%;background:#16a34a}.muted{color:#64748b}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.wrap{padding:12px}}</style></head><body><div class="wrap"><h1>Executive Production Dashboard</h1><p class="muted">Supabase Single Source of Truth • LINE01–LINE18 • Auto refresh 3 sec</p><div class="cards"><div class="card">OUTPUT<div class="n" id="out">0</div></div><div class="card">GOOD<div class="n" id="g">0</div></div><div class="card">NG<div class="n" id="n">0</div></div><div class="card">REPAIR<div class="n" id="r">0</div></div></div><table><thead><tr><th>Line</th><th>Good</th><th>NG</th><th>Repair</th><th>Output</th><th>Graph</th></tr></thead><tbody id="tb"></tbody></table><p class="muted" id="st"></p></div><script src="/config.js"></script><script>async function api(path){let x=await fetch(ONLINE_CONFIG.SUPABASE_URL+'/rest/v1/'+path,{headers:{apikey:ONLINE_CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+ONLINE_CONFIG.SUPABASE_ANON_KEY}});if(!x.ok)throw Error(await x.text());return x.json()}async function refresh(){try{let rows=await api('production_events?select=line,type,qty&status=eq.ACTIVE');let m={};for(let i=1;i<=18;i++)m['LINE'+String(i).padStart(2,'0')]={GOOD:0,NG:0,REPAIR:0};rows.forEach(x=>m[x.line][x.type]+=Number(x.qty));let G=0,N=0,R=0,max=1;Object.values(m).forEach(x=>{G+=x.GOOD;N+=x.NG;R+=x.REPAIR;max=Math.max(max,x.GOOD+x.NG)});g.textContent=G;n.textContent=N;r.textContent=R;out.textContent=G+N;tb.innerHTML=Object.entries(m).map(([l,x])=>{let o=x.GOOD+x.NG;return `<tr><td><b>${l}</b></td><td>${x.GOOD}</td><td>${x.NG}</td><td>${x.REPAIR}</td><td><b>${o}</b></td><td><div class=bar><div class=fill style="width:${o/max*100}%"></div></div></td></tr>`}).join('');st.textContent='Last update '+new Date().toLocaleString()}catch(e){st.textContent='ERROR '+e.message}}refresh();setInterval(refresh,3000)</script></body></html>
