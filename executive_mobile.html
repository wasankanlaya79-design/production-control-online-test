<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Executive Mobile</title><style>body{font-family:Arial;background:#0f172a;color:white;margin:0}.w{padding:16px}.c{background:#1e293b;border-radius:16px;padding:16px;margin:10px 0}.line{display:grid;grid-template-columns:1fr repeat(4,auto);gap:10px;align-items:center}.big{font-size:30px;font-weight:900}.muted{color:#94a3b8}</style></head><body><div class=w><h2>Executive Mobile</h2><div class=c>OUTPUT <span class=big id=total>0</span><div class=muted>LIVE • Supabase</div></div><div id=list></div></div><script src="/config.js"></script><script>async function refresh(){let x=await fetch(ONLINE_CONFIG.SUPABASE_URL+'/rest/v1/production_events?select=line,type,qty&status=eq.ACTIVE',{headers:{apikey:ONLINE_CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+ONLINE_CONFIG.SUPABASE_ANON_KEY}});let a=await x.json(),m={};for(let i=1;i<=18;i++)m['LINE'+String(i).padStart(2,'0')]={GOOD:0,NG:0,REPAIR:0};a.forEach(e=>m[e.line][e.type]+=+e.qty);let t=0;list.innerHTML=Object.entries(m).map(([l,v])=>{let o=v.GOOD+v.NG;t+=o;return `<div class="c line"><b>${l}</b><span>G ${v.GOOD}</span><span>NG ${v.NG}</span><span>R ${v.REPAIR}</span><span class=big>${o}</span></div>`}).join('');total.textContent=t}refresh();setInterval(refresh,3000)</script></body></html>
