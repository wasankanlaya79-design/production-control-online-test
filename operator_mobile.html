<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production Operator</title><style>body{font-family:Arial;margin:0;background:#0f172a;color:#fff}.wrap{max-width:520px;margin:auto;padding:18px}.card{background:#1e293b;padding:18px;border-radius:18px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}select,input,button{width:100%;padding:15px;border:0;border-radius:12px;font-size:18px;box-sizing:border-box}button{font-weight:800;color:white}.ok{background:#16a34a}.ng{background:#dc2626}.repair{background:#d97706}.num{font-size:38px;font-weight:900}.muted{color:#94a3b8}</style></head><body><div class="wrap"><h2>Production Control • Operator</h2><div class="card"><label>LINE</label><select id="line"></select><br><br><label>JOB ID</label><input id="job" value="TEST-JOB-LINE01"><br><br><label>FO</label><input id="fo" value="TEST-FO-001"></div><div class="card"><div class="row"><div>GOOD<div class="num" id="good">0</div></div><div>NG<div class="num" id="ng">0</div></div><div>REPAIR<div class="num" id="repair">0</div></div><div>OUTPUT<div class="num" id="output">0</div></div></div></div><div class="row"><button class="ok" onclick="send('GOOD')">OK +1</button><button class="ng" onclick="send('NG')">NG +1</button></div><button class="repair" style="margin-top:10px" onclick="send('REPAIR')">REPAIR +1</button><p class="muted" id="status">Connecting…</p></div><script src="/config.js"></script><script>for(let i=1;i<=18;i++)line.add(new Option('LINE'+String(i).padStart(2,'0'),'LINE'+String(i).padStart(2,'0')));async function api(path,opt={}){let r=await fetch(ONLINE_CONFIG.SUPABASE_URL+'/rest/v1/'+path,{...opt,headers:{apikey:ONLINE_CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+ONLINE_CONFIG.SUPABASE_ANON_KEY,'Content-Type':'application/json',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status==204?null:r.json()}async function refresh(){try{let x=await api('production_events?select=type,qty&line=eq.'+line.value+'&status=eq.ACTIVE');let a={GOOD:0,NG:0,REPAIR:0};x.forEach(e=>a[e.type]=(a[e.type]||0)+Number(e.qty));good.textContent=a.GOOD;ng.textContent=a.NG;repair.textContent=a.REPAIR;output.textContent=a.GOOD+a.NG;status.textContent='LIVE • '+new Date().toLocaleTimeString()}catch(e){status.textContent='ERROR • '+e.message}}async function send(type){try{let id=crypto.randomUUID();await api('production_events',{method:'POST',headers:{Prefer:'return=minimal'},body:JSON.stringify({event_id:id,line:line.value,job_id:job.value,fo:fo.value,production_date:new Date().toISOString().slice(0,10),type,qty:1,source:'OPERATOR_MOBILE',status:'ACTIVE',device_id:'mobile-web',client_created_at:new Date().toISOString()})});navigator.vibrate?.(80);await refresh()}catch(e){alert(e.message)}}line.onchange=refresh;refresh();setInterval(refresh,3000)</script></body></html>
